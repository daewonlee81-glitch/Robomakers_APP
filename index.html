<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboMakers WordBlock</title>
<link rel="icon" type="image/png" href="img/favicon.png?v=0.3.19">
<link rel="apple-touch-icon" href="img/icon-192.png?v=0.3.19">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="워드블럭">
<meta name="theme-color" content="#2E6ABF">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/app.css?v=0.3.19">
<script src="vendor/blockly/blockly_compressed.js?v=0.3.19"></script>
<script src="vendor/blockly/blocks_compressed.js?v=0.3.19"></script>
<script src="vendor/blockly/python_compressed.js?v=0.3.19"></script>
<script src="vendor/mpy-cross/mpy-cross-v6.js?v=0.3.19"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="img/logo.png?v=0.3.19" width="34" height="34" alt="" data-i18n-alt="brand.logoAlt">
    <div><strong data-i18n="brand.name"></strong><span data-i18n="brand.sub"></span></div>
  </div>

  <div class="group">
    <select id="hubSelect" data-i18n-title="top.hub">
      <option value="prime">SPIKE Prime</option>
      <option value="essential">SPIKE Essential</option>
      <option value="ev3">EV3</option>
    </select>
    <select id="transportSelect" data-i18n-title="top.transport"></select>
    <button id="btnConnect" class="btn-connect" data-i18n="top.connect"></button>
    <span class="hubinfo"><i id="hubStatus" class="dot"></i><span id="hubName" data-i18n="top.notConnected"></span></span>
  </div>

  <div class="group run">
    <button id="btnRun" class="btn-run" disabled data-i18n="top.run" data-i18n-title="top.runTitle"></button>
    <button id="btnUpload" class="btn-upload" disabled data-i18n-title="top.uploadTitle"><span class="ico">📥</span><span class="lbl" data-i18n="top.upload"></span></button>
    <button id="btnStop" class="btn-stop" disabled data-i18n="top.stop" data-i18n-title="top.stopTitle"></button>
    <progress id="progress" max="1" value="0" hidden></progress>
  </div>

  <div class="group right">
    <button id="btnTutor" class="btn-tutor" aria-pressed="false" data-i18n-title="top.tutorTitle"><span class="ico">🤖</span><span class="lbl" data-i18n="top.tutor"></span></button>
    <button id="btnSim" class="btn-sim" data-i18n-title="top.simTitle"><span class="ico">🧪</span><span class="lbl" data-i18n="top.sim"></span></button>
    <input id="projectName" data-i18n-value="top.projectDefault" data-i18n-title="top.project">
    <div class="menuwrap">
      <button id="btnExamples" data-i18n="top.examples"></button>
      <div id="exampleMenu" class="menu" hidden></div>
    </div>
    <div class="menuwrap">
      <button id="btnFile" data-i18n="top.file"></button>
      <div id="fileMenu" class="menu" hidden>
        <button id="btnNew" data-i18n="top.newTitle"></button>
        <button id="btnOpen" data-i18n="top.openTitle"></button>
        <button id="btnSave" data-i18n="top.saveTitle"></button>
      </div>
    </div>
    <div class="menuwrap">
      <button id="btnDownload" class="btn-download" data-i18n="top.download" data-i18n-title="top.downloadTitle"></button>
      <div id="downloadMenu" class="menu" hidden>
        <button data-dl="py"><b data-i18n="dl.py"></b><small data-i18n="dl.pyDesc"></small></button>
        <button data-dl="zip"><b data-i18n="dl.zip"></b><small data-i18n="dl.zipDesc"></small></button>
        <button data-dl="esp32"><b data-i18n="dl.esp32"></b><small data-i18n="dl.esp32Desc"></small></button>
        <button data-dl="project"><b data-i18n="dl.project"></b><small data-i18n="dl.projectDesc"></small></button>
      </div>
    </div>
    <select id="langSelect" class="lang" data-i18n-title="top.lang"></select>
    <button id="btnInstall" class="btn-install" data-i18n-title="top.installTitle" aria-label="📲">📲</button>
    <button id="btnHelp" class="btn-help" data-i18n-title="help.btn" aria-label="?">?</button>
    <button id="btnPanel" data-i18n-title="top.panel">⇥</button>
    <input type="file" id="fileInput" accept=".json" hidden>
  </div>
</header>

<div id="browserWarn" class="warn" hidden data-i18n="warn.browser"></div>

<main>
  <div id="blocklyDiv"></div>

  <aside class="panel">
    <nav class="tabs">
      <button class="tab active" data-pane="panePython" data-i18n="tab.python"></button>
      <button class="tab" data-pane="paneCam" data-i18n="tab.cam"></button>
      <button class="tab" data-pane="panePad" data-i18n="tab.pad"></button>
      <button class="tab" id="tabHusky" data-pane="paneHusky" data-i18n="tab.husky"></button>
      <button class="tab" id="tabStatus" data-pane="paneStatus" data-i18n="tab.status"></button>
      <button class="tab" id="tabLearn" data-pane="paneLearn" data-i18n="tab.learn"></button>
    </nav>

    <section id="panePython" class="pane">
      <div class="pane-tools">
        <label class="switch"><input type="checkbox" id="editToggle"> <span data-i18n="py.edit"></span></label>
        <span class="spacer"></span>
        <button id="btnCopyPy" data-i18n="py.copy"></button>
        <button id="btnExportPy" data-i18n="py.save"></button>
      </div>
      <p id="editNote" class="note" hidden data-i18n="py.editNote"></p>
      <pre id="codeView" class="code"></pre>
      <textarea id="codeEdit" class="code" spellcheck="false" hidden></textarea>
    </section>

    <section id="paneCam" class="pane" hidden>
      <div class="pane-tools">
        <div id="camModes" class="chips">
          <label><input type="checkbox" value="hand" checked><span data-i18n="cam.chip.hand"></span></label>
          <label><input type="checkbox" value="pose"><span data-i18n="cam.chip.pose"></span></label>
          <label><input type="checkbox" value="object"><span data-i18n="cam.chip.object"></span></label>
          <label><input type="checkbox" value="teach"><span data-i18n="cam.chip.teach"></span></label>
          <label><input type="checkbox" value="color"><span data-i18n="cam.chip.color"></span></label>
        </div>
        <button id="btnCam" class="primary" data-i18n="cam.on"></button>
        <button type="button" class="guide-btn" data-aiguide="" data-i18n="cam.guide"></button>
      </div>
      <div class="cam">
        <video id="camVideo" playsinline muted></video>
        <canvas id="camCanvas"></canvas>
        <div id="camHint" class="cam-hint" data-i18n="cam.hint"></div>
        <button type="button" id="btnCamGray" class="cam-gray-btn" aria-pressed="false" data-i18n="cam.gray" data-i18n-title="cam.grayTitle"></button>
      </div>
      <div id="camReadout" class="readout"></div>

      <div id="teachPanel" class="learn" hidden>
        <h4><span data-i18n="teach.heading"></span><button type="button" class="guide-btn sm" data-aiguide="teach" data-i18n="cam.guide"></button></h4>
        <p class="muted" data-i18n="teach.help"></p>
        <div id="teachRows"></div>
        <div class="learn-tools">
          <button id="btnTeachExport" data-i18n="teach.export"></button>
          <button id="btnTeachImport" data-i18n="teach.import"></button>
          <button id="btnTeachClear" data-i18n="teach.clearAll"></button>
          <input type="file" id="teachFile" accept=".json" hidden>
        </div>
      </div>

      <div id="colorPanel" class="learn" hidden>
        <h4><span data-i18n="color.heading"></span><button type="button" class="guide-btn sm" data-aiguide="color" data-i18n="cam.guide"></button></h4>
        <p class="muted" data-i18n="color.help"></p>
        <div id="colorRows"></div>
      </div>
      <details id="aiGuide" class="aig-inline">
        <summary data-i18n="aiguide.title"></summary>
        <div class="aig-body"></div>
      </details>
      <p class="note" data-i18n="cam.privacy"></p>
    </section>

    <section id="panePad" class="pane" hidden>
      <div class="pane-tools">
        <span id="padName" class="muted" data-i18n="pad.none"></span>
        <span class="spacer"></span>
        <label class="switch"><input type="checkbox" id="padRelay" checked> <span data-i18n="pad.relay"></span></label>
      </div>
      <div id="padState"></div>
      <div class="note" data-i18n="pad.help"></div>
    </section>

    <section id="paneHusky" class="pane" hidden>
      <div class="pane-tools">
        <label class="muted" for="huskyPort" data-i18n="husky.port"></label>
        <select id="huskyPort"></select>
        <select id="huskyKind">
          <option value="block" data-i18n="husky.kind.block"></option>
          <option value="line" data-i18n="husky.kind.line"></option>
        </select>
        <span class="spacer"></span>
        <button id="btnHuskyRun" class="primary" data-i18n="husky.run" data-i18n-title="husky.runTitle"></button>
      </div>
      <div class="cam husky">
        <canvas id="huskyCanvas" width="640" height="480"></canvas>
        <div id="huskyHint" class="cam-hint" data-i18n="husky.wait"></div>
      </div>
      <div id="huskyReadout" class="readout"></div>
      <div class="note" data-i18n="husky.help"></div>
    </section>

    <section id="paneStatus" class="pane" hidden>
      <div class="pane-tools">
        <span id="statusHub" class="muted"></span>
        <span class="spacer"></span>
        <button id="btnStatusRun" class="primary" data-i18n="st.run" data-i18n-title="st.runTitle"></button>
      </div>
      <div id="statusView"></div>
      <div id="espView"></div>
      <div class="note" data-i18n="st.help"></div>
    </section>
    <section id="paneLearn" class="pane learn" hidden></section>

    <div class="termwrap">
      <div class="termbar"><span data-i18n="term.title"></span><button id="btnClearTerm" data-i18n="term.clear"></button></div>
      <pre id="terminal"></pre>
    </div>
  </aside>
</main>

<aside id="tutorDrawer" class="tutor" hidden></aside>
<div id="helpModal" class="modal" hidden></div>
<div id="installModal" class="modal" hidden></div>
<div id="toast"></div>
<script type="module" src="js/main.js?v=0.3.19"></script>
</body>
</html>
